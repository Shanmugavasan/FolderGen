<!DOCTYPE html>
<html>

<head>
    <title>FolderGen - Folder Generator</title>
    <style>
        body {
            font-family: sans-serif;
            background: #0f172a;
            color: white;
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
        }

        header {
            padding: 20px;
            background: #1e293b;
            display: flex;
            justify-content: space-between;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 20px;
            flex: 1;
        }

        textarea {
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 15px;
            font-family: monospace;
        }

        #preview {
            background: #020617;
            border-radius: 8px;
            padding: 15px;
            overflow-y: auto;
            white-space: pre;
            font-family: monospace;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #3b82f6;
        }
    </style>
</head>

<body>
    <header>
        <h1>FolderGen 📁</h1>
        <button onclick="downloadZip()">Download .zip</button>
    </header>
    <div class="container">
        <textarea id="input" placeholder="Paste structure here..." oninput="updatePreview()"></textarea>
        <div id="preview">Preview will appear here...</div>
    </div>

    <script src="node_modules/jszip/dist/jszip.min.js"></script>
    <script>
        const input = document.getElementById('input');
        const preview = document.getElementById('preview');

        // Helper function to clean common AI junk from a line
        function cleanLineText(line) {
            // 1. Strip comments (#, //, --)
            let clean = line.split('#')[0].split('//')[0].split('--')[0];

            // 2. Strip tree symbols (│, ├, └, ─)
            clean = clean.replace(/[│├└─]/g, '');

            // 3. Strip trailing slashes (some AI write "folder/")
            clean = clean.trim().replace(/[/\\]$/, '');

            return clean;
        }

        function updatePreview() {
            const lines = input.value.split('\n');
            let previewText = "";

            lines.forEach(line => {
                if (!line.trim()) return;

                const name = cleanLineText(line);
                if (!name) return;

                // Calculate depth for visual indentation in the preview
                const depth = line.search(/\S/);
                const indent = " ".repeat(depth);

                // Add a little emoji to the preview for vibes
                const icon = name.includes('.') ? "📄 " : "📁 ";
                previewText += `${indent}${icon}${name}\n`;
            });

            preview.innerText = previewText || "Preview will appear here...";
        }

        async function downloadZip() {
            const zip = new JSZip();
            const lines = input.value.split('\n');
            const lastAtDepth = { [-1]: zip };

            lines.forEach(line => {
                if (!line.trim()) return;

                const name = cleanLineText(line);
                if (!name) return;

                const depth = line.search(/\S/);

                const parentDepth = Object.keys(lastAtDepth)
                    .map(Number)
                    .filter(d => d < depth)
                    .sort((a, b) => b - a)[0] ?? -1;

                const currentParent = lastAtDepth[parentDepth];

                if (name.includes('.')) {
                    currentParent.file(name, "");
                } else {
                    const folder = currentParent.folder(name);
                    lastAtDepth[depth] = folder;
                }
            });

            const content = await zip.generateAsync({ type: "blob" });
            const url = window.URL.createObjectURL(content);
            const a = document.createElement("a");
            a.href = url;
            a.download = "project_structure.zip";
            a.click();
        }
    </script>
</body>

</html>
